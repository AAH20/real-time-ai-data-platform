[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtimeiq"
version = "0.1.0"
description = "Real-time data engineering, predictive analytics, prescriptive analytics and BI unit economics"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Ahmed Hassan"}]

[project.scripts]
realtimeiq = "realtimeiq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
